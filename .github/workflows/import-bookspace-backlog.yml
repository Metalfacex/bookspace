name: Import BookSpace Backlog
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Create 12 issues and labels (safe to rerun)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BACKLOG_DATA: ""
        run: |
          python3 - <<'PYTHON'
          import os,json,zlib,base64,urllib.request,urllib.error,time
          base='https://api.github.com/repos/'+os.environ['REPO']
          token=os.environ['GH_TOKEN']
          def api(path, method='GET', data=None):
              payload=None if data is None else json.dumps(data,ensure_ascii=False).encode('utf-8')
              req=urllib.request.Request(base+path,data=payload,method=method,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  return json.load(response)
          stories=json.loads(zlib.decompress(base64.b64decode(os.environ['BACKLOG_DATA'])))
          existing=[]
          page=1
          while True:
              chunk=api('/issues?state=all&per_page=100&page='+str(page))
              existing.extend(x['title'] for x in chunk if 'pull_request' not in x)
              if len(chunk)<100:break
              page+=1
          for s in stories:
              if s['title'] in existing:
                  print('Skipped existing:',s['title']);continue
              priority=s['priority'].replace('’',"'")
              labels=['MoSCoW: '+priority,'SP: '+str(s['points'])]
              if priority=='Must have':labels.append('MVP')
              for label in labels:
                  try:api('/labels','POST',{'name':label,'color':'1D76DB' if label.startswith('SP:') else '0E8A16' if label=='MVP' else 'D4C5F9'})
                  except urllib.error.HTTPError as e:
                      if e.code!=422:raise
              created=api('/issues','POST',{'title':s['title'],'body':s['body'],'labels':labels})
              print('Created:',created['html_url'])
          PYTHON

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 1. სტატიკური შემოწმება: კოდის ფორმატი (.editorconfig) — გაშვების გარეშე
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Formatting (dotnet format)
        run: dotnet format whitespace --folder . --verify-no-changes

      - name: Build with code-style analyzers
        run: dotnet build BookSpace.sln -c Release -p:EnforceCodeStyleInBuild=true

  # 2. Unit + Integration + API ტესტები, coverage — რეალურ MS SQL Server-ზე
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "BookSpace_Test_2026!"
        ports:
          - 1433:1433

    env:
      # Integration და API ტესტები რეალურ MS SQL Server-ზე ეშვება
      BOOKSPACE_TEST_SQLSERVER: "Server=localhost,1433;User Id=sa;Password=BookSpace_Test_2026!;TrustServerCertificate=True;Encrypt=False"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore BookSpace.sln

      - name: Build
        run: dotnet build BookSpace.sln --no-restore -c Release

      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/localhost/1433) >/dev/null 2>&1 && break
            sleep 2
          done
          sleep 10

      - name: Test (unit + integration + API) with coverage
        run: >
          dotnet test BookSpace.sln --no-build -c Release
          --logger "console;verbosity=normal"
          --logger "trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Coverage report
        if: always()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage-report -reporttypes:"Html;TextSummary;MarkdownSummaryGithub"
          cat coverage-report/Summary.txt
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage-report
            TestResults/**/*.trx

  # 3. End-to-End (Playwright, ბრაუზერში) + დატვირთვის ტესტი (k6) გაშვებულ აპლიკაციაზე
  e2e-and-load:
    runs-on: ubuntu-latest
    needs: build-and-test

    env:
      ASPNETCORE_URLS: http://localhost:5180
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Sqlite
      ConnectionStrings__DefaultConnection: "Data Source=/tmp/bookspace-e2e.db"
      BookSpace__Reminders__Enabled: "false"
      BOOKSPACE_E2E_URL: http://localhost:5180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build BookSpace.sln -c Release

      - name: Start BookSpace
        run: |
          nohup dotnet run --project src/BookSpace.Web -c Release --no-build --no-launch-profile > app.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5180/ > /dev/null && echo "app is up" && exit 0
            sleep 2
          done
          cat app.log
          exit 1

      - name: Install Playwright browser
        run: pwsh tests/BookSpace.E2ETests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: End-to-End tests
        run: dotnet test tests/BookSpace.E2ETests -c Release --no-build --logger "console;verbosity=normal"

      - uses: grafana/setup-k6-action@v1

      - name: Load test (NFR-1, NFR-2)
        run: k6 run -e BASE_URL=http://localhost:5180 -e DURATION=30s load/rooms-load.js

      - name: App log
        if: always()
        run: tail -n 100 app.log
